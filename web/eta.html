<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Live ETA · Convoy</title>
<meta name="description" content="Follow along live and see when they'll arrive." />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/vendor/maplibre-gl.css" />
<style>
  :root { --bg: #f2f3f5; --card: rgba(255,255,255,.94); --text: #0a0a0b; --muted: #6b7280; --accent: #0a84ff; --ok: #1fa851; --border: rgba(10,10,11,.08); color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: rgba(22,24,28,.94); --text: #fff; --muted: #a1a1aa; --accent: #1e9bff; --ok: #30d158; --border: rgba(255,255,255,.08); color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: fixed; inset: 0; }
  .card { position: fixed; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top)); max-width: 460px; margin: 0 auto; background: var(--card);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--border); border-radius: 22px; padding: 14px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
  .who { display: flex; align-items: center; gap: 10px; }
  .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; flex: none; background: var(--accent); }
  .line { font-weight: 700; }
  .muted { color: var(--muted); font-size: 13px; }
  .eta { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; }
  .eta b { font-size: 34px; line-height: 1; font-weight: 900; letter-spacing: -.5px; }
  .eta span { color: var(--muted); font-weight: 600; }
  .done b { color: var(--ok); }
  .foot { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); text-align: center; }
  .foot a { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); color: var(--text); text-decoration: none;
    font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  .foot img { width: 18px; height: 18px; border-radius: 5px; }
  .car { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; display: grid; place-items: center; box-shadow: 0 3px 10px rgba(0,0,0,.35); transition: transform .8s linear; }
  .car svg { width: 18px; height: 18px; }
  .pin { width: 22px; height: 22px; border-radius: 50% 50% 50% 0; background: #ff3b30; transform: rotate(-45deg); border: 3px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.35); }
  .gone { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
  .gone h1 { margin: 0 0 6px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="map"></div>

<div class="card hidden" id="card" aria-live="polite">
  <div class="who">
    <div class="av" id="av">?</div>
    <div>
      <div class="line" id="headline">Loading…</div>
      <div class="muted" id="updated"></div>
    </div>
  </div>
  <div class="eta" id="eta"><b id="eta-time">–</b><span id="eta-left"></span></div>
</div>

<div class="gone hidden" id="gone">
  <div>
    <h1>This link has ended</h1>
    <p class="muted">Live ETA links stop after the drive (or 6 hours).</p>
  </div>
</div>

<div class="foot"><a href="/about"><img src="/apple-touch-icon.png" alt="" />Shared with Convoy</a></div>

<script type="module" src="/eta.js"></script>
</body>
</html>
