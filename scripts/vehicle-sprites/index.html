<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Convoy vehicle sprites</title>
<style>
  body { margin: 0; background: #2a2d33; color: #fff; font: 14px system-ui; }
  #grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; }
  #grid canvas { max-width: 240px; height: auto; background: repeating-conic-gradient(#3a3d44 0 25%, #30333a 0 50%) 0 0 / 16px 16px; border-radius: 8px; }
  #status { padding: 12px; font-weight: 700; }
</style>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
</head>
<body>
<div id="status">rendering…</div>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Top-down sprites: the map rotates them to the driver's heading, so the camera looks straight
// down (front of the vehicle = top of the image). Perspective + soft shadow sell the 3D.
const SIZE = 192; // @3x
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const pmrem = new THREE.PMREMGenerator(renderer);
const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const M = {
  paint: (c) => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.38, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.1, envMapIntensity: 0.55 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x0b1424, roughness: 0.18, metalness: 0.1, clearcoat: 1, envMapIntensity: 0.25 }),
  tire: new THREE.MeshStandardMaterial({ color: 0x15161a, roughness: 0.85 }),
  rim: new THREE.MeshStandardMaterial({ color: 0xc9ced6, roughness: 0.25, metalness: 0.9 }),
  trim: new THREE.MeshStandardMaterial({ color: 0x23252b, roughness: 0.6 }),
  white: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.3, clearcoat: 1 }),
  head: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff6d5, emissiveIntensity: 1.4 }),
  tail: new THREE.MeshStandardMaterial({ color: 0xff2d2d, emissive: 0xff1a1a, emissiveIntensity: 1.2 }),
  seat: new THREE.MeshStandardMaterial({ color: 0x2b2420, roughness: 0.7 }),
  skin: new THREE.MeshStandardMaterial({ color: 0x3a3f4a, roughness: 0.6 }),
};

function box(g, w, h, d, r, mat, x, y, z) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, Math.min(r, w / 2, h / 2, d / 2)), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  g.add(m);
  return m;
}
function wheel(g, x, z, r = 0.38, w = 0.3) {
  const t = new THREE.Mesh(new THREE.CylinderGeometry(r, r, w, 24), M.tire);
  t.rotation.z = Math.PI / 2;
  t.position.set(x, r, z);
  t.castShadow = true;
  g.add(t);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.55, r * 0.55, w + 0.02, 16), M.rim);
  hub.rotation.z = Math.PI / 2;
  hub.position.set(x, r, z);
  g.add(hub);
}
function wheels(g, halfW, zs, r, w) {
  for (const z of zs) for (const s of [-1, 1]) wheel(g, s * halfW, z, r, w);
}
function lights(g, halfW, y, front, rear, wide = 0.42) {
  for (const s of [-1, 1]) {
    box(g, wide, 0.14, 0.08, 0.03, M.head, s * (halfW - wide / 2 - 0.08), y, front);
    box(g, wide, 0.14, 0.08, 0.03, M.tail, s * (halfW - wide / 2 - 0.08), y, rear);
  }
}

// Forward is -Z.
const BUILD = {
  hatch(g, p) {
    box(g, 1.85, 0.64, 3.8, 0.3, p, 0, 0.62, 0);
    box(g, 1.64, 0.58, 2.35, 0.3, M.glass, 0, 1.17, 0.45);
    box(g, 1.5, 0.12, 1.85, 0.06, p, 0, 1.49, 0.55);
    box(g, 1.2, 0.06, 0.12, 0.03, M.trim, 0, 1.57, 1.45); // roof spoiler lip
    wheels(g, 0.86, [-1.2, 1.2], 0.37, 0.3);
    lights(g, 0.93, 0.74, -1.9, 1.9, 0.38);
  },
  classic(g, p) {
    box(g, 1.95, 0.6, 4.9, 0.32, p, 0, 0.6, 0);
    for (const s of [-1, 1]) {
      box(g, 0.5, 0.42, 1.25, 0.2, p, s * 0.78, 0.82, -1.45); // round front fenders
      box(g, 0.5, 0.42, 1.25, 0.2, p, s * 0.78, 0.82, 1.5);
    }
    box(g, 2.0, 0.14, 0.16, 0.06, M.rim, 0, 0.45, -2.48); // chrome bumpers
    box(g, 2.0, 0.14, 0.16, 0.06, M.rim, 0, 0.45, 2.48);
    box(g, 1.6, 0.52, 1.9, 0.32, M.glass, 0, 1.1, 0.2);
    box(g, 1.45, 0.12, 1.45, 0.08, M.white, 0, 1.38, 0.25); // two-tone white roof
    wheels(g, 0.88, [-1.5, 1.5], 0.4, 0.3);
    for (const s of [-1, 1]) {
      const h = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.08, 20), M.head);
      h.rotation.x = Math.PI / 2;
      h.position.set(s * 0.72, 0.8, -2.45);
      g.add(h);
      box(g, 0.2, 0.14, 0.08, 0.03, M.tail, s * 0.78, 0.72, 2.45);
    }
  },
  van(g, p) {
    box(g, 2.0, 1.55, 5.1, 0.3, p, 0, 1.15, 0.1);
    box(g, 2.0, 0.7, 0.9, 0.3, p, 0, 0.75, -2.6); // short nose
    box(g, 1.9, 0.62, 0.5, 0.2, M.glass, 0, 1.45, -2.0); // windshield
    for (const s of [-1, 1]) box(g, 0.06, 0.45, 3.2, 0.03, M.glass, s * 1.0, 1.55, 0.5); // side windows
    for (const s of [-1, 1]) box(g, 0.07, 0.07, 3.6, 0.03, M.trim, s * 0.78, 1.96, 0.5); // roof rails
    box(g, 1.1, 0.05, 0.9, 0.03, M.glass, 0, 1.94, -0.9); // skylight
    wheels(g, 0.93, [-1.95, 1.75], 0.42, 0.34);
    lights(g, 1.0, 0.85, -3.05, 2.68);
  },
  car(g, p, contrast) {
    box(g, 1.9, 0.62, 4.3, 0.28, p, 0, 0.62, 0);
    box(g, 1.66, 0.56, 2.25, 0.3, M.glass, 0, 1.15, 0.25);
    box(g, 1.52, 0.12, 1.55, 0.06, p, 0, 1.46, 0.35);
    wheels(g, 0.88, [-1.35, 1.35]);
    lights(g, 0.95, 0.72, -2.15, 2.15);
  },
  sport(g, p, contrast) {
    box(g, 2.05, 0.5, 4.5, 0.25, p, 0, 0.52, 0);
    box(g, 1.6, 0.42, 1.8, 0.28, M.glass, 0, 0.92, 0.35);
    box(g, 1.4, 0.1, 1.15, 0.05, p, 0, 1.13, 0.45);
    // racing stripes
    for (const s of [-1, 1]) {
      box(g, 0.16, 0.04, 1.7, 0.02, contrast, s * 0.22, 0.79, -1.25);
      box(g, 0.16, 0.04, 1.1, 0.02, contrast, s * 0.22, 1.19, 0.45);
    }
    // spoiler
    box(g, 2.0, 0.08, 0.35, 0.04, M.trim, 0, 1.02, 2.05);
    for (const s of [-1, 1]) box(g, 0.08, 0.3, 0.12, 0.02, M.trim, s * 0.7, 0.85, 2.05);
    wheels(g, 0.95, [-1.4, 1.45], 0.4, 0.36);
    lights(g, 1.02, 0.6, -2.25, 2.25, 0.5);
  },
  suv(g, p, contrast) {
    box(g, 2.0, 0.85, 4.7, 0.28, p, 0, 0.8, 0);
    box(g, 1.84, 0.62, 3.25, 0.25, M.glass, 0, 1.45, 0.45);
    box(g, 1.72, 0.12, 2.9, 0.06, p, 0, 1.79, 0.55);
    for (const s of [-1, 1]) box(g, 0.07, 0.07, 2.6, 0.03, M.trim, s * 0.72, 1.88, 0.55);
    wheels(g, 0.93, [-1.5, 1.5], 0.45, 0.34);
    lights(g, 1.0, 0.95, -2.35, 2.35);
  },
  pickup(g, p, contrast) {
    box(g, 2.0, 0.75, 1.9, 0.25, p, 0, 0.75, -1.55); // hood
    box(g, 2.0, 0.85, 1.4, 0.25, p, 0, 0.8, -0.05); // cab body
    box(g, 1.82, 0.55, 1.35, 0.25, M.glass, 0, 1.4, 0.0);
    box(g, 1.7, 0.12, 1.05, 0.06, p, 0, 1.7, 0.05);
    // bed
    box(g, 2.0, 0.2, 2.1, 0.08, M.trim, 0, 0.55, 1.75);
    for (const s of [-1, 1]) box(g, 0.16, 0.6, 2.1, 0.07, p, s * 0.92, 0.85, 1.75);
    box(g, 2.0, 0.6, 0.16, 0.07, p, 0, 0.85, 2.75);
    wheels(g, 0.93, [-1.55, 1.75], 0.46, 0.36);
    lights(g, 1.0, 0.95, -2.5, 2.84);
  },
  moto(g, p, contrast) {
    g.scale.setScalar(1.45); // a bike at true scale is unreadable on the map
    wheel(g, 0, -1.0, 0.42, 0.18);
    wheel(g, 0, 1.0, 0.42, 0.18);
    box(g, 0.42, 0.42, 1.5, 0.18, p, 0, 0.75, -0.1); // tank + body
    box(g, 0.36, 0.14, 0.75, 0.07, M.seat, 0, 0.98, 0.45);
    box(g, 1.0, 0.06, 0.08, 0.03, M.trim, 0, 1.15, -0.75); // handlebars
    box(g, 0.2, 0.1, 0.06, 0.03, M.head, 0, 0.95, -1.05);
    // rider
    box(g, 0.62, 0.5, 0.4, 0.18, M.skin, 0, 1.35, 0.25);
    const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.27, 32, 16), M.paint(0xffffff));
    helmet.position.set(0, 1.8, 0.05);
    helmet.castShadow = true;
    g.add(helmet);
    const visor = new THREE.Mesh(new THREE.SphereGeometry(0.28, 32, 16, -Math.PI * 0.85, Math.PI * 0.7, Math.PI * 0.3, Math.PI * 0.3), M.glass);
    visor.position.copy(helmet.position);
    g.add(visor);
    for (const s of [-1, 1]) box(g, 0.14, 0.14, 0.62, 0.07, M.skin, s * 0.36, 1.25, -0.25); // arms
  },
  jeep(g, p, contrast) {
    box(g, 1.95, 0.8, 4.0, 0.14, p, 0, 0.8, 0);
    box(g, 1.75, 0.1, 1.3, 0.04, M.trim, 0, 1.22, -1.25); // hood vents
    box(g, 1.75, 0.45, 0.1, 0.04, M.glass, 0, 1.45, -0.55); // windshield
    for (const s of [-1, 1]) {
      box(g, 0.55, 0.3, 0.55, 0.1, M.seat, s * 0.45, 1.3, 0.05); // seats
      box(g, 0.1, 0.1, 1.6, 0.04, M.trim, s * 0.85, 1.95, 0.4); // roll bar
      box(g, 0.1, 0.75, 0.1, 0.04, M.trim, s * 0.85, 1.58, 1.2);
      box(g, 0.1, 0.75, 0.1, 0.04, M.trim, s * 0.85, 1.58, -0.4);
    }
    box(g, 1.8, 0.1, 0.1, 0.04, M.trim, 0, 1.95, 1.2);
    box(g, 1.8, 0.1, 0.1, 0.04, M.trim, 0, 1.95, -0.4);
    const spare = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.28, 24), M.tire);
    spare.rotation.x = Math.PI / 2;
    spare.position.set(0, 1.0, 2.15);
    spare.castShadow = true;
    g.add(spare);
    wheels(g, 0.98, [-1.3, 1.3], 0.5, 0.42);
    lights(g, 0.98, 1.0, -2.02, 2.02, 0.3);
  },
};

// ?view=side renders the garage showroom shots instead of the top-down map sprites.
const VIEW = new URLSearchParams(location.search).get('view') === 'side' ? 'side' : 'top';
const SIDE_W = 720;
const SIDE_H = 360;

function render(name, paint) {
  const side = VIEW === 'side';
  renderer.setSize(side ? SIDE_W : SIZE, side ? SIDE_H : SIZE);
  const scene = new THREE.Scene();
  scene.environment = envMap;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445066, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(side ? 4 : -4, 10, side ? -4 : -3);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.radius = 6;
  Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 30 });
  scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.38 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const g = new THREE.Group();
  const contrast = paint.light ? M.trim : M.white;
  BUILD[name](g, M.paint(paint.hex), contrast);
  scene.add(g);

  const camera = new THREE.PerspectiveCamera(side ? 20 : 24, side ? SIDE_W / SIDE_H : 1, 1, 100);
  if (side) {
    // Showroom: a low three-quarter view of the right side, nose pointing right.
    camera.position.set(9.4, 2.3, -3.0);
    camera.lookAt(0, 0.7, 0.05);
  } else {
    // Slight tilt from behind shows the rear and the cabin's sides without fighting the map's rotation.
    const tilt = THREE.MathUtils.degToRad(16);
    camera.position.set(0, 15 * Math.cos(tilt), 15 * Math.sin(tilt));
    camera.up.set(0, 0, -1);
    camera.lookAt(0, 0, 0);
  }
  renderer.render(scene, camera);

  const out = document.createElement('canvas');
  out.width = side ? SIDE_W : SIZE;
  out.height = side ? SIDE_H : SIZE;
  out.getContext('2d').drawImage(renderer.domElement, 0, 0);
  return out;
}

function scaled(src, size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, size, size);
  return c;
}

async function save(canvas, name) {
  const blob = await new Promise((r) => canvas.toBlob(r, name.endsWith('.webp') ? 'image/webp' : 'image/png', 0.9));
  const res = await fetch(`/save?name=${name}`, { method: 'POST', body: blob });
  if (!res.ok) throw new Error(`save ${name} failed`);
}

// Keep in sync with PAINTS in src/lib/vehicles.ts.
const PAINTS = {
  blue: { hex: 0x1e9bff }, red: { hex: 0xe5281f }, orange: { hex: 0xff8a00 }, yellow: { hex: 0xffc400, light: true },
  green: { hex: 0x2dbe60 }, purple: { hex: 0x8e5cff }, white: { hex: 0xeef0f3, light: true }, silver: { hex: 0x9aa3ae, light: true },
  black: { hex: 0x1c1d22 },
};
const only = new URLSearchParams(location.search).get('only'); // e.g. ?only=van for quick previews
const grid = document.getElementById('grid');
for (const name of Object.keys(BUILD).filter((n) => !only || n === only)) {
  for (const [color, paint] of Object.entries(PAINTS)) {
    const big = render(name, paint);
    const file = `${name}-${color}`;
    if (VIEW === 'side') {
      // One sharp size, WebP to keep the app bundle small (81 cards).
      grid.appendChild(big);
      await save(big, `side-${file}@2x.webp`);
      continue;
    }
    grid.appendChild(scaled(big, 96));
    await save(big, `${file}@3x.png`);
    await save(scaled(big, (SIZE * 2) / 3), `${file}@2x.png`);
    await save(scaled(big, SIZE / 3), `${file}.png`);
  }
}
document.getElementById('status').textContent = 'done';
</script>
</body>
</html>
