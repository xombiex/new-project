<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Top-down sprites: the map rotates them to the driver's heading, so the camera looks straight
// down (front of the vehicle = top of the image). Perspective + soft shadow sell the 3D.
const SIZE = 192; // @3x
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Low-poly look: every panel is a flat facet, colors are saturated and lit simply (no reflections).
const flat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0, flatShading: true, side: THREE.DoubleSide, ...extra });
const M = {
  paint: (c) => flat(c),
  glass: flat(0x1b2733, { roughness: 0.35 }),
  tire: flat(0x1d1d21, { roughness: 0.95 }),
  rim: flat(0xd5d8dc, { roughness: 0.5 }),
  trim: flat(0x24252a),
  white: flat(0xf4f4f0),
  chrome: flat(0xd9dde2, { roughness: 0.35 }),
  head: flat(0xfff4c9, { emissive: 0xfff0b8, emissiveIntensity: 0.9 }),
  tail: flat(0xff2a22, { emissive: 0xc40f0a, emissiveIntensity: 0.8 }),
  seat: flat(0x3a2f28),
  skin: flat(0x343a46),
};

/** A cross-section along the car: z, sill height, belt height, top height, belt half-width, top half-width. */
const st = (z, y0, y1, y2, w, t, w0 = w * 0.88) => ({ z, y0, y1, y2, w, t, w0 });

/** Lofts cross-sections into one faceted shell, capped at both ends. */
function loft(g, stations, mat, x = 0) {
  const ring = (a) => [[-a.w0, a.y0], [-a.w, a.y1], [-a.t, a.y2], [a.t, a.y2], [a.w, a.y1], [a.w0, a.y0]].map(([px, py]) => [px, py, a.z]);
  const v = [];
  const tri = (a, b, c) => v.push(...a, ...b, ...c);
  for (let i = 0; i < stations.length - 1; i++) {
    const a = ring(stations[i]);
    const b = ring(stations[i + 1]);
    for (let k = 0; k < 6; k++) {
      const n = (k + 1) % 6;
      tri(a[k], b[k], b[n]);
      tri(a[k], b[n], a[n]);
    }
  }
  for (const r of [ring(stations[0]), ring(stations[stations.length - 1])]) for (let k = 1; k < 5; k++) tri(r[0], r[k], r[k + 1]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat);
  m.position.x = x;
  m.castShadow = true;
  g.add(m);
  return m;
}

function box(g, w, h, d, mat, x, y, z, rotX = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.x = rotX;
  m.castShadow = true;
  g.add(m);
  return m;
}

/** A painted stripe that follows the bodywork: [z, y] points, at x, half-width hw. */
function stripe(g, points, x, hw, mat) {
  loft(g, points.map(([z, y]) => st(z, y - 0.015, y + 0.005, y + 0.02, hw, hw, hw)), mat, x);
}

/** Big chunky wheels: eight-sided tire, six-sided hub. */
function wheel(g, x, z, r = 0.44, w = 0.36) {
  const t = new THREE.Mesh(new THREE.CylinderGeometry(r, r, w, 8), M.tire);
  t.rotation.z = Math.PI / 2;
  t.position.set(x, r, z);
  t.castShadow = true;
  g.add(t);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.55, r * 0.55, w + 0.03, 6), M.rim);
  hub.rotation.z = Math.PI / 2;
  hub.position.set(x, r, z);
  g.add(hub);
}
function wheels(g, x, zs, r, w) {
  for (const z of zs) for (const s of [-1, 1]) wheel(g, s * x, z, r, w);
}
/** Headlights and taillights: blocky pairs at the corners. */
function lights(g, x, y, front, rear, wide = 0.42, h = 0.16) {
  for (const s of [-1, 1]) {
    box(g, wide, h, 0.1, M.head, s * x, y, front);
    box(g, wide, h, 0.1, M.tail, s * x, y, rear);
  }
}
/** Windows and a painted roof: a raked glasshouse with a thin roof panel on top. */
function cabin(g, p, { front, peakF, peakR, rear, base, top, w, t, roof = p }) {
  loft(g, [st(front, base, base + 0.01, base + 0.03, w, w - 0.03, w), st(peakF, base, base + 0.05, top, w, t, w), st(peakR, base, base + 0.05, top, w, t, w), st(rear, base, base + 0.01, base + 0.03, w, w - 0.03, w)], M.glass);
  loft(g, [st(peakF - 0.06, top - 0.01, top + 0.01, top + 0.08, t + 0.03, t - 0.03, t + 0.03), st(peakR + 0.06, top - 0.01, top + 0.01, top + 0.08, t + 0.03, t - 0.03, t + 0.03)], roof);
}

// Forward is -Z. Short, wide and tall on big wheels: toy-car proportions that read on a map.
const BUILD = {
  classic(g, p, c) {
    // Long hood, short deck: a sixties fastback.
    loft(g, [st(-2.5, 0.34, 0.64, 0.74, 0.96, 0.82), st(-2.3, 0.3, 0.72, 0.84, 1.08, 0.92), st(-0.5, 0.3, 0.76, 0.94, 1.14, 0.96), st(1.5, 0.3, 0.78, 0.94, 1.16, 0.96), st(2.3, 0.34, 0.76, 0.9, 1.1, 0.92), st(2.48, 0.42, 0.7, 0.8, 0.96, 0.84)], p);
    cabin(g, p, { front: -0.6, peakF: 0.0, peakR: 0.75, rear: 2.05, base: 0.92, top: 1.42, w: 0.96, t: 0.72, roof: c });
    for (const s of [-1, 1]) stripe(g, [[-2.45, 0.77], [-2.3, 0.87], [-0.6, 0.97]], s * 0.26, 0.13, c);
    box(g, 2.2, 0.14, 0.14, M.chrome, 0, 0.42, -2.52);
    box(g, 2.2, 0.14, 0.14, M.chrome, 0, 0.42, 2.5);
    wheels(g, 1.05, [-1.55, 1.55], 0.44, 0.38);
    for (const s of [-1, 1]) {
      const h = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.08, 8), M.head);
      h.rotation.x = Math.PI / 2;
      h.position.set(s * 0.7, 0.66, -2.52);
      g.add(h);
      box(g, 0.34, 0.14, 0.08, M.tail, s * 0.68, 0.68, 2.49);
    }
  },
  jeep(g, p, c) {
    loft(g, [st(-2.05, 0.56, 0.92, 1.06, 1.02, 0.92), st(-0.5, 0.56, 0.98, 1.16, 1.08, 0.96), st(1.8, 0.56, 0.98, 1.16, 1.08, 0.96), st(2.0, 0.62, 0.94, 1.1, 1.0, 0.9)], p);
    box(g, 1.8, 0.5, 0.08, M.glass, 0, 1.4, -0.5, 0.2); // upright windshield
    for (const s of [-1, 1]) {
      box(g, 0.56, 0.34, 0.56, M.seat, s * 0.44, 1.32, 0.3); // seats
      box(g, 0.1, 0.1, 1.7, M.trim, s * 0.86, 2.0, 0.55); // roll cage
      box(g, 0.1, 0.84, 0.1, M.trim, s * 0.86, 1.58, 1.4);
      box(g, 0.1, 0.84, 0.1, M.trim, s * 0.86, 1.58, -0.3);
      stripe(g, [[-2, 1.09], [-0.5, 1.19]], s * 0.3, 0.11, c);
    }
    box(g, 1.8, 0.1, 0.1, M.trim, 0, 2.0, 1.4);
    box(g, 1.8, 0.1, 0.1, M.trim, 0, 2.0, -0.3);
    box(g, 2.2, 0.2, 0.14, M.trim, 0, 0.62, -2.08);
    const spare = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.44, 0.3, 8), M.tire);
    spare.rotation.x = Math.PI / 2;
    spare.position.set(0, 1.12, 2.16);
    spare.castShadow = true;
    g.add(spare);
    wheels(g, 1.14, [-1.3, 1.3], 0.6, 0.52);
    lights(g, 0.66, 0.92, -2.07, 2.02, 0.3, 0.26);
  },
  tuner(g, p, c) {
    // Slammed coupe: bolt-on flares, tall wing, a stripe down the flank.
    loft(g, [st(-2.2, 0.22, 0.5, 0.6, 0.96, 0.78), st(-2.0, 0.18, 0.58, 0.72, 1.16, 0.94), st(-0.8, 0.18, 0.66, 0.82, 1.2, 0.98), st(1.3, 0.18, 0.68, 0.86, 1.24, 1), st(2.05, 0.22, 0.68, 0.84, 1.16, 0.94), st(2.2, 0.32, 0.62, 0.74, 0.98, 0.8)], p);
    cabin(g, p, { front: -0.85, peakF: -0.2, peakR: 0.7, rear: 1.5, base: 0.82, top: 1.28, w: 0.92, t: 0.7 });
    for (const s of [-1, 1]) {
      for (const z of [-1.35, 1.35]) box(g, 0.2, 0.28, 1.08, p, s * 1.2, 0.56, z); // flares
      box(g, 0.03, 0.14, 3.0, c, s * 1.235, 0.5, 0); // flank stripe
      box(g, 0.1, 0.42, 0.14, M.trim, s * 0.8, 1.05, 2.0); // wing posts
    }
    box(g, 2.5, 0.07, 0.46, M.trim, 0, 1.3, 2.05);
    for (const s of [-1, 1]) box(g, 0.07, 0.3, 0.6, c, s * 1.25, 1.3, 2.05);
    box(g, 0.7, 0.04, 0.42, M.trim, 0, 0.82, -1.25, -0.09); // hood vent
    box(g, 2.1, 0.1, 0.12, M.trim, 0, 0.22, -2.2); // lip
    wheels(g, 1.16, [-1.35, 1.35], 0.42, 0.42);
    lights(g, 0.68, 0.52, -2.21, 2.21, 0.46, 0.1);
  },
  muscle(g, p, c) {
    // Long nose, big hips: blacked-out hood, a shaker scoop and fat rear tires.
    loft(g, [st(-2.5, 0.3, 0.66, 0.78, 1.0, 0.86), st(-2.28, 0.26, 0.74, 0.9, 1.14, 0.96), st(-0.45, 0.26, 0.78, 0.98, 1.14, 0.96), st(0.5, 0.26, 0.76, 0.96, 1.1, 0.94), st(1.5, 0.26, 0.86, 1.02, 1.24, 1.02), st(2.3, 0.3, 0.84, 1, 1.18, 0.98), st(2.46, 0.4, 0.78, 0.9, 1.02, 0.88)], p);
    cabin(g, p, { front: -0.55, peakF: 0.05, peakR: 0.7, rear: 1.95, base: 0.96, top: 1.44, w: 0.94, t: 0.72 });
    loft(g, [st(-2.4, 0.78, 0.8, 0.82, 0.62, 0.62, 0.62), st(-2.26, 0.9, 0.92, 0.94, 0.66, 0.66, 0.66), st(-0.55, 0.98, 1, 1.02, 0.66, 0.66, 0.66)], M.trim); // black hood
    box(g, 0.56, 0.2, 0.7, c, 0, 1.08, -1.25); // scoop
    box(g, 0.44, 0.06, 0.1, M.trim, 0, 1.1, -1.62);
    for (const s of [-1, 1]) stripe(g, [[1.75, 1.05], [2.3, 1.03]], s * 0.28, 0.13, c);
    box(g, 2.2, 0.16, 0.14, M.trim, 0, 0.42, -2.5);
    box(g, 2.28, 0.12, 0.08, M.tail, 0, 0.76, 2.47); // full-width taillight
    for (const s of [-1, 1]) {
      wheel(g, s * 1.04, -1.5, 0.42, 0.34);
      wheel(g, s * 1.1, 1.55, 0.5, 0.5);
    }
    for (const s of [-1, 1]) box(g, 0.42, 0.14, 0.08, M.head, s * 0.62, 0.68, -2.51);
  },
  super(g, p, c) {
    // Mid-engine wedge: cabin pushed forward, side intakes, a long tail and no room for luggage.
    loft(g, [st(-2.5, 0.18, 0.3, 0.36, 0.98, 0.72), st(-2.1, 0.14, 0.42, 0.5, 1.2, 0.92), st(-1.0, 0.14, 0.5, 0.62, 1.28, 0.98), st(0.2, 0.14, 0.52, 0.68, 1.22, 0.96), st(1.3, 0.14, 0.66, 0.84, 1.34, 1.04), st(2.3, 0.2, 0.68, 0.84, 1.26, 1), st(2.5, 0.3, 0.64, 0.72, 1.06, 0.86)], p);
    cabin(g, p, { front: -1.35, peakF: -0.6, peakR: 0.15, rear: 1.45, base: 0.62, top: 1.06, w: 0.88, t: 0.56 });
    for (const s of [-1, 1]) {
      loft(g, [st(0.1, 0.24, 0.3, 0.56, 0.1, 0.1, 0.1), st(0.75, 0.24, 0.3, 0.62, 0.1, 0.1, 0.1)], M.trim, s * 1.22); // side intake
      box(g, 0.5, 0.08, 0.1, M.head, s * 0.72, 0.38, -2.38); // slit headlights
      box(g, 0.58, 0.08, 0.08, M.tail, s * 0.66, 0.7, 2.48);
    }
    stripe(g, [[-2.44, 0.39], [-2.1, 0.53], [-1.35, 0.66]], 0, 0.1, c);
    stripe(g, [[-0.65, 1.14], [0.2, 1.14]], 0, 0.1, c);
    box(g, 1.1, 0.04, 0.6, M.glass, 0, 0.87, 1.5, 0.05); // engine cover
    box(g, 2.2, 0.08, 0.24, M.trim, 0, 0.18, 2.42); // diffuser
    wheels(g, 1.18, [-1.5, 1.45], 0.42, 0.46);
  },
  rally(g, p, c) {
    // Stage car: tall on its springs, roof scoop, mud flaps, a pod of spotlights on the nose.
    loft(g, [st(-1.95, 0.5, 0.82, 0.94, 0.94, 0.82), st(-1.72, 0.46, 0.94, 1.08, 1.12, 0.96), st(-0.75, 0.46, 1, 1.18, 1.16, 1), st(1.6, 0.46, 1, 1.18, 1.16, 1), st(1.9, 0.54, 0.96, 1.12, 1.04, 0.9)], p);
    cabin(g, p, { front: -0.85, peakF: -0.25, peakR: 1.3, rear: 1.72, base: 1.16, top: 1.78, w: 1.02, t: 0.82 });
    box(g, 0.44, 0.14, 0.5, M.trim, 0, 1.92, 0.25); // roof scoop
    for (const s of [-1, 1]) {
      box(g, 0.03, 0.42, 0.58, M.white, s * 1.17, 0.82, 0); // door number roundel
      box(g, 0.02, 0.24, 0.3, M.trim, s * 1.19, 0.82, 0);
      box(g, 0.42, 0.34, 0.05, M.trim, s * 0.94, 0.3, 1.78); // mud flaps
      box(g, 0.42, 0.34, 0.05, M.trim, s * 0.94, 0.3, -0.72);
      for (const x of [0.18, 0.5]) box(g, 0.24, 0.24, 0.12, M.head, s * x, 1.05, -1.82); // spot pod
    }
    stripe(g, [[-1.88, 0.97], [-1.72, 1.11], [-0.85, 1.21]], 0.5, 0.17, c);
    box(g, 1.4, 0.05, 0.06, M.trim, 0, 0.88, -1.86);
    wheels(g, 1.08, [-1.18, 1.22], 0.48, 0.42);
    lights(g, 0.72, 0.88, -1.97, 1.91, 0.3, 0.14);
  },
  wagon(g, p, c) {
    // Long-roof family hauler: wood on the flanks and a rack up top.
    const wood = flat(0x8a5a2e);
    const trim = flat(0xd9c49a);
    loft(g, [st(-2.45, 0.34, 0.66, 0.78, 0.94, 0.8), st(-2.22, 0.3, 0.76, 0.92, 1.1, 0.94), st(-1, 0.3, 0.84, 1.02, 1.14, 0.96), st(2.3, 0.3, 0.84, 1.02, 1.14, 0.96), st(2.46, 0.38, 0.8, 0.96, 1.02, 0.88)], p);
    cabin(g, p, { front: -1.1, peakF: -0.5, peakR: 2.15, rear: 2.38, base: 1, top: 1.62, w: 1, t: 0.84 });
    for (const s of [-1, 1]) {
      box(g, 0.03, 0.42, 3.3, wood, s * 1.135, 0.72, 0.55);
      box(g, 0.04, 0.05, 3.36, trim, s * 1.14, 0.96, 0.55);
      box(g, 0.04, 0.05, 3.36, trim, s * 1.14, 0.48, 0.55);
      box(g, 0.08, 0.08, 2.5, M.trim, s * 0.72, 1.78, 0.85); // rack rails
    }
    for (const z of [0.05, 0.85, 1.65]) box(g, 1.5, 0.05, 0.06, M.trim, 0, 1.82, z);
    box(g, 2.1, 0.14, 0.14, M.chrome, 0, 0.42, -2.47);
    box(g, 2.1, 0.14, 0.14, M.chrome, 0, 0.42, 2.48);
    wheels(g, 1.02, [-1.5, 1.6], 0.42, 0.36);
    lights(g, 0.68, 0.74, -2.46, 2.47, 0.4, 0.16);
  },
  hotrod(g, p, c) {
    // Chopped roof, engine out in the open, skinny fronts and huge rears.
    loft(g, [st(-2.45, 0.56, 0.72, 0.82, 0.42, 0.36), st(-1.25, 0.56, 0.8, 0.98, 0.56, 0.48), st(-0.55, 0.42, 0.86, 1.08, 0.82, 0.74), st(1.5, 0.42, 0.86, 1.1, 0.88, 0.8), st(2.15, 0.52, 0.8, 0.98, 0.72, 0.62)], p);
    cabin(g, p, { front: -0.6, peakF: -0.45, peakR: 0.85, rear: 1.2, base: 1.06, top: 1.42, w: 0.8, t: 0.72, roof: c });
    box(g, 0.76, 0.4, 1.0, M.chrome, 0, 1.08, -1.25); // engine
    box(g, 0.32, 0.18, 0.66, M.tail, 0, 1.36, -1.25); // valve cover
    for (const s of [-1, 1]) {
      for (const z of [-1.55, -1.25, -0.95]) box(g, 0.12, 0.3, 0.12, M.trim, s * 0.28, 1.52, z); // stacks
      box(g, 0.14, 0.12, 2.4, M.chrome, s * 0.72, 0.46, 0.1); // side pipes
      wheel(g, s * 0.9, -1.95, 0.34, 0.22);
      wheel(g, s * 1.02, 1.5, 0.6, 0.6);
      const h = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.14, 8), M.head);
      h.rotation.x = Math.PI / 2;
      h.position.set(s * 0.56, 0.86, -2.25);
      g.add(h);
    }
    box(g, 0.36, 0.44, 0.1, M.chrome, 0, 0.84, -2.47); // grille
    box(g, 1.1, 0.1, 0.08, M.tail, 0, 0.82, 2.16);
  },
  buggy(g, p, c) {
    // Sand rail: a little tub, a tube cage, all wheel and no body.
    loft(g, [st(-2.0, 0.62, 0.72, 0.82, 0.5, 0.42), st(-1.05, 0.54, 0.82, 0.98, 0.72, 0.62), st(0.6, 0.54, 0.84, 1, 0.82, 0.72), st(1.15, 0.62, 0.8, 0.94, 0.62, 0.54)], p);
    stripe(g, [[-1.95, 0.85], [-1.05, 1.01]], 0, 0.14, c);
    for (const s of [-1, 1]) {
      box(g, 0.5, 0.26, 0.5, M.seat, s * 0.34, 1.1, 0.1); // seats
      box(g, 0.09, 0.09, 1.9, M.trim, s * 0.62, 2.06, 0.3); // cage
      box(g, 0.09, 1.1, 0.09, M.trim, s * 0.74, 1.5, 1.2);
      box(g, 0.09, 1.1, 0.09, M.trim, s * 0.74, 1.5, -0.65);
      box(g, 0.08, 0.08, 1.5, M.trim, s * 0.74, 0.86, 1.55); // rear tubes
      box(g, 1.3, 0.08, 0.08, M.trim, 0, 0.72, -1.72); // front axle
      wheel(g, s * 1.08, -1.65, 0.5, 0.38);
      wheel(g, s * 1.16, 1.5, 0.66, 0.6);
      box(g, 0.24, 0.24, 0.14, M.head, s * 0.26, 2.2, -0.65);
    }
    box(g, 1.3, 0.09, 0.09, M.trim, 0, 2.06, 1.2);
    box(g, 1.3, 0.09, 0.09, M.trim, 0, 2.06, -0.65);
    box(g, 0.72, 0.44, 0.7, M.chrome, 0, 0.96, 1.62); // rear engine
    box(g, 0.34, 0.16, 0.42, M.trim, 0, 1.26, 1.62);
    box(g, 0.26, 0.1, 0.06, M.tail, 0, 0.92, 2.0);
  },
  bus(g, p, c) {
    // Short city bus: a long glass band, a contrasting stripe and a sign on the nose.
    loft(g, [st(-2.9, 0.34, 1.1, 2.3, 1.08, 0.92), st(-2.62, 0.3, 1.1, 2.56, 1.2, 1.02), st(2.72, 0.3, 1.1, 2.56, 1.2, 1.02), st(2.9, 0.36, 1.08, 2.44, 1.1, 0.94)], p);
    for (const s of [-1, 1]) {
      box(g, 0.03, 0.62, 4.9, M.glass, s * 1.2, 1.62, 0.1); // windows
      for (const z of [-1.7, -0.9, -0.1, 0.7, 1.5]) box(g, 0.04, 0.62, 0.1, p, s * 1.205, 1.62, z);
      box(g, 0.03, 0.2, 5.3, c, s * 1.205, 0.98, 0); // stripe
    }
    loft(g, [st(-2.92, 1.2, 1.26, 1.32, 1.02, 0.98, 1.02), st(-2.82, 1.3, 1.36, 2.1, 1.02, 0.92, 1.02), st(-2.78, 1.3, 1.36, 2.1, 1.02, 0.92, 1.02)], M.glass); // windshield
    box(g, 1.3, 0.2, 0.05, M.head, 0, 2.32, -2.78); // destination sign
    box(g, 1.7, 0.08, 3.6, c, 0, 2.6, 0); // roof stripe
    box(g, 0.8, 0.14, 1.3, flat(0xb9bcc2), 0, 2.68, 1.2); // AC pod
    wheels(g, 1.1, [-1.75, 1.9], 0.5, 0.36);
    lights(g, 0.8, 0.72, -2.92, 2.91, 0.34, 0.2);
    box(g, 2.3, 0.18, 0.1, M.trim, 0, 0.46, -2.91);
  },
  moto(g, p, c) {
    g.scale.setScalar(1.5); // a bike at true scale is unreadable on the map
    wheel(g, 0, -1.0, 0.44, 0.2);
    wheel(g, 0, 1.0, 0.44, 0.2);
    loft(g, [st(-0.95, 0.74, 0.82, 0.96, 0.18, 0.1), st(-0.55, 0.56, 0.86, 1.12, 0.27, 0.16), st(0.1, 0.5, 0.82, 1.06, 0.26, 0.18), st(0.6, 0.66, 0.9, 1.08, 0.18, 0.14), st(1.05, 0.86, 0.98, 1.1, 0.12, 0.08)], p);
    box(g, 0.3, 0.12, 0.72, M.seat, 0, 1.12, 0.42);
    box(g, 1.05, 0.06, 0.08, M.trim, 0, 1.24, -0.72); // handlebars
    box(g, 0.2, 0.12, 0.06, M.head, 0, 1, -0.98);
    box(g, 0.16, 0.08, 0.06, M.tail, 0, 1.06, 1.06);
  },
};

// Kenney's Car Kit (CC0, see kenney/License.txt). App vehicle → model. `stock` ones keep their
// official colors (a police car stays a police car); the rest get repainted.
const KENNEY = {
  car: { file: 'sedan' }, hatch: { file: 'hatchback-sports' }, sport: { file: 'sedan-sports' }, suv: { file: 'suv', bodyHue: 0.42 }, luxury: { file: 'suv-luxury' },
  van: { file: 'van' }, pickup: { file: 'truck' }, truck: { file: 'delivery' }, flatbed: { file: 'delivery-flat' },
  formula: { file: 'race' }, future: { file: 'race-future' }, kart: { file: 'kart-oopi' }, tractor: { file: 'tractor' },
  taxi: { file: 'taxi', stock: true }, police: { file: 'police', stock: true }, ambulance: { file: 'ambulance', stock: true },
  firetruck: { file: 'firetruck', stock: true }, garbage: { file: 'garbage-truck', stock: true },
};
const gltfLoader = new GLTFLoader();
const kenneyModels = Object.fromEntries(await Promise.all(Object.entries(KENNEY).map(async ([k, v]) => [k, (await gltfLoader.loadAsync(`/kenney/${v.file}.glb`)).scene])));
const paletteImage = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.src = '/kenney/Textures/colormap.png'; });
const palette = (() => {
  const c = document.createElement('canvas');
  c.width = paletteImage.width; c.height = paletteImage.height;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(paletteImage, 0, 0);
  return x.getImageData(0, 0, c.width, c.height);
})();

const hueOf = (r, g, b) => { const c = new THREE.Color(); c.setRGB(r / 255, g / 255, b / 255, THREE.SRGBColorSpace); return c.getHSL({}, THREE.SRGBColorSpace); };

/** Where the body's main color sits in the palette: the band its largest surfaces sample. */
function bodyBand(model, hint) {
  // A body can be several meshes under one node.
  const bodies = [];
  model.traverse((m) => { if (m.isMesh && /body|^kart/.test(`${m.name} ${m.parent?.name ?? ''}`)) bodies.push(m); });
  const w = palette.width, h = palette.height;
  const counts = new Map();
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), n = new THREE.Vector3();
  for (const mesh of bodies) {
  const g = mesh.geometry;
  const pos = g.attributes.position, uv = g.attributes.uv, idx = g.index;
  const count = idx ? idx.count : pos.count;
  for (let t = 0; t < count; t += 3) {
    const [i0, i1, i2] = idx ? [idx.getX(t), idx.getX(t + 1), idx.getX(t + 2)] : [t, t + 1, t + 2];
    a.fromBufferAttribute(pos, i0); b.fromBufferAttribute(pos, i1); c.fromBufferAttribute(pos, i2);
    n.crossVectors(b.clone().sub(a), c.clone().sub(a));
    const area = n.length();
    n.normalize();
    const u = (uv.getX(i0) + uv.getX(i1) + uv.getX(i2)) / 3, v = (uv.getY(i0) + uv.getY(i1) + uv.getY(i2)) / 3;
    const px = Math.min(w - 1, Math.floor(u * w)), py = Math.min(h - 1, Math.floor(v * h));
    const i = (py * w + px) * 4;
    const hsl = hueOf(palette.data[i], palette.data[i + 1], palette.data[i + 2]);
    if (hsl.s < 0.22 || hsl.l < 0.15 || hsl.l > 0.8) continue; // glass, trim, chrome
    if (hint != null && Math.abs(hsl.h - hint) > 0.09) continue;
    const key = `${Math.round(hsl.h * 36)}:${Math.floor(py / (h / 4))}`;
    const e = counts.get(key) ?? { weight: 0, px, py, hue: hsl.h };
    e.weight += area * hsl.s * hsl.s * (Math.abs(n.y) > 0.4 ? 1.6 : 1); // paint is saturated; slate roofs and trim aren't
    counts.set(key, e);
  }
  }
  return [...counts.values()].sort((x, y) => y.weight - x.weight)[0];
}

/** A copy of the palette with one color band swapped for the paint, keeping its light-to-dark shading. */
function repaintPalette(band, hex) {
  const w = palette.width, h = palette.height;
  const out = new ImageData(new Uint8ClampedArray(palette.data), w, h);
  const rowH = h / 4;
  const y0 = Math.floor(band.py / rowH) * rowH;
  const inBand = (x, y) => {
    const i = (y * w + x) * 4;
    const c = hueOf(palette.data[i], palette.data[i + 1], palette.data[i + 2]);
    let d = Math.abs(c.h - band.hue);
    d = Math.min(d, 1 - d);
    return d < 0.045 && c.s > 0.15;
  };
  // Grow sideways from the sampled spot until the hue changes.
  const mid = y0 + Math.floor(rowH / 2);
  let x0 = band.px, x1 = band.px;
  while (x0 > 0 && inBand(x0 - 1, mid)) x0--;
  while (x1 < w - 1 && inBand(x1 + 1, mid)) x1++;
  let sum = 0, n = 0;
  for (let y = y0; y < y0 + rowH; y++) for (let x = x0; x <= x1; x++) {
    const i = (y * w + x) * 4;
    sum += 0.3 * out.data[i] + 0.59 * out.data[i + 1] + 0.11 * out.data[i + 2];
    n++;
  }
  const mean = sum / n;
  const [tr, tg, tb] = [(hex >> 16) & 255, (hex >> 8) & 255, hex & 255];
  for (let y = y0; y < y0 + rowH; y++) for (let x = x0; x <= x1; x++) {
    const i = (y * w + x) * 4;
    const k = (0.3 * out.data[i] + 0.59 * out.data[i + 1] + 0.11 * out.data[i + 2]) / mean;
    out.data[i] = tr * k; out.data[i + 1] = tg * k; out.data[i + 2] = tb * k;
  }
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').putImageData(out, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.flipY = false;
  return t;
}

/** A Kenney car, repainted, scaled to our world and turned to face -Z. */
function buildKenney(g, name, hex) {
  const model = kenneyModels[name].clone(true);
  const map = KENNEY[name].stock ? null : repaintPalette(bodyBand(kenneyModels[name], KENNEY[name].bodyHue), hex);
  model.traverse((m) => {
    if (!m.isMesh) return;
    m.castShadow = true;
    if (map) {
      m.material = m.material.clone();
      m.material.map = map;
    }
  });
  const size = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3());
  // About car-sized on the map; long ones are limited so they stay inside a sprite.
  const scale = Math.min(1.75, 4.9 / size.z, 3.6 / size.x);
  const center = new THREE.Box3().setFromObject(model).getCenter(new THREE.Vector3());
  model.position.set(-center.x, 0, -center.z);
  g.add(model);
  g.scale.setScalar(scale);
  g.rotation.y = Math.PI;
}

// ?view=side renders the garage showroom shots instead of the top-down map sprites.
const VIEW = new URLSearchParams(location.search).get('view') === 'side' ? 'side' : 'top';
const SIDE_W = 720;
const SIDE_H = 360;

function render(name, paint) {
  const side = VIEW === 'side';
  renderer.setSize(side ? SIDE_W : SIZE, side ? SIDE_H : SIZE);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6a6f80, 1.5));
  const sun = new THREE.DirectionalLight(0xffffff, 2.0);
  sun.position.set(side ? 5 : -4, 10, side ? -5 : -3);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.radius = 3;
  Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 30 });
  scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.32 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const g = new THREE.Group();
  const contrast = paint.light ? flat(0xe0431c) : M.white;
  if (KENNEY[name]) buildKenney(g, name, paint.hex);
  else BUILD[name](g, M.paint(paint.hex), contrast);
  scene.add(g);
  // Long and tall: they'd run off the edge of a top-down sprite at full size.
  if (!side && (name === 'truck' || name === 'bus')) g.scale.setScalar(0.84);

  // The truck and bus stand tallest, so their showroom shots pull back a little.
  const tall = name === 'truck' || name === 'bus';
  const camera = new THREE.PerspectiveCamera(side ? (tall ? 25 : 19) : 24, side ? SIDE_W / SIDE_H : 1, 1, 100);
  if (side) {
    // Showroom: a low three-quarter view of the right side, nose pointing right.
    camera.position.set(9.6, 4.2, -5.4);
    camera.lookAt(0, tall ? 1.3 : 0.75, -0.1);
  } else {
    // Slight tilt from behind shows the rear and the cabin's sides without fighting the map's rotation.
    const tilt = THREE.MathUtils.degToRad(16);
    camera.position.set(0, 15 * Math.cos(tilt), 15 * Math.sin(tilt));
    camera.up.set(0, 0, -1);
    camera.lookAt(0, 0, 0);
  }
  renderer.render(scene, camera);

  const out = document.createElement('canvas');
  out.width = side ? SIDE_W : SIZE;
  out.height = side ? SIDE_H : SIZE;
  out.getContext('2d').drawImage(renderer.domElement, 0, 0);
  return out;
}

function scaled(src, size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, size, size);
  return c;
}

async function save(canvas, name) {
  const blob = await new Promise((r) => canvas.toBlob(r, name.endsWith('.webp') ? 'image/webp' : 'image/png', 0.9));
  const res = await fetch(`/save?name=${name}`, { method: 'POST', body: blob });
  if (!res.ok) throw new Error(`save ${name} failed`);
}

// Keep in sync with PAINTS in src/lib/vehicles.ts.
const PAINTS = {
  blue: { hex: 0x1e9bff }, red: { hex: 0xe5281f }, orange: { hex: 0xff8a00 }, yellow: { hex: 0xffc400, light: true },
  green: { hex: 0x2dbe60 }, purple: { hex: 0x8e5cff }, white: { hex: 0xeef0f3, light: true }, silver: { hex: 0x9aa3ae, light: true },
  black: { hex: 0x1c1d22 },
};
const params = new URLSearchParams(location.search);
const only = params.get('only'); // e.g. ?only=van for quick previews
const onlyPaint = params.get('paint');
const NOSAVE = params.has('nosave');
const grid = document.getElementById('grid');
for (const name of [...Object.keys(KENNEY), ...Object.keys(BUILD)].filter((n) => !only || n === only)) {
  // Official liveries come in one finish: <name>-stock.
  for (const [color, paint] of KENNEY[name]?.stock ? [['stock', {}]] : Object.entries(PAINTS)) {
    if (onlyPaint && color !== onlyPaint && color !== 'stock') continue;
    const big = render(name, paint);
    const file = `${name}-${color}`;
    if (VIEW === 'side') {
      // One sharp size, WebP to keep the app bundle small (81 cards).
      grid.appendChild(big);
      if (NOSAVE) continue;
      await save(big, `side-${file}@2x.webp`);
      continue;
    }
    grid.appendChild(scaled(big, 96));
    if (NOSAVE) continue;
    await save(big, `${file}@3x.png`);
    await save(scaled(big, (SIZE * 2) / 3), `${file}@2x.png`);
    await save(scaled(big, SIZE / 3), `${file}.png`);
  }
}
document.getElementById('status').textContent = 'done';
</script>
</body>
</html>
