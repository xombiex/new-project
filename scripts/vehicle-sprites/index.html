<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Convoy vehicle sprites</title>
<style>
  body { margin: 0; background: #2a2d33; color: #fff; font: 14px system-ui; }
  #grid { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; }
  #grid canvas { max-width: 240px; height: auto; background: repeating-conic-gradient(#3a3d44 0 25%, #30333a 0 50%) 0 0 / 16px 16px; border-radius: 8px; }
  #status { padding: 12px; font-weight: 700; }
</style>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
</head>
<body>
<div id="status">rendering…</div>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';

// Top-down sprites: the map rotates them to the driver's heading, so the camera looks straight
// down (front of the vehicle = top of the image). Perspective + soft shadow sell the 3D.
const SIZE = 192; // @3x
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Low-poly look: every panel is a flat facet, colors are saturated and lit simply (no reflections).
const flat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0, flatShading: true, side: THREE.DoubleSide, ...extra });
const M = {
  paint: (c) => flat(c),
  glass: flat(0x1b2733, { roughness: 0.35 }),
  tire: flat(0x1d1d21, { roughness: 0.95 }),
  rim: flat(0xd5d8dc, { roughness: 0.5 }),
  trim: flat(0x24252a),
  white: flat(0xf4f4f0),
  chrome: flat(0xd9dde2, { roughness: 0.35 }),
  head: flat(0xfff4c9, { emissive: 0xfff0b8, emissiveIntensity: 0.9 }),
  tail: flat(0xff2a22, { emissive: 0xc40f0a, emissiveIntensity: 0.8 }),
  seat: flat(0x3a2f28),
  skin: flat(0x343a46),
};

/** A cross-section along the car: z, sill height, belt height, top height, belt half-width, top half-width. */
const st = (z, y0, y1, y2, w, t, w0 = w * 0.88) => ({ z, y0, y1, y2, w, t, w0 });

/** Lofts cross-sections into one faceted shell, capped at both ends. */
function loft(g, stations, mat, x = 0) {
  const ring = (a) => [[-a.w0, a.y0], [-a.w, a.y1], [-a.t, a.y2], [a.t, a.y2], [a.w, a.y1], [a.w0, a.y0]].map(([px, py]) => [px, py, a.z]);
  const v = [];
  const tri = (a, b, c) => v.push(...a, ...b, ...c);
  for (let i = 0; i < stations.length - 1; i++) {
    const a = ring(stations[i]);
    const b = ring(stations[i + 1]);
    for (let k = 0; k < 6; k++) {
      const n = (k + 1) % 6;
      tri(a[k], b[k], b[n]);
      tri(a[k], b[n], a[n]);
    }
  }
  for (const r of [ring(stations[0]), ring(stations[stations.length - 1])]) for (let k = 1; k < 5; k++) tri(r[0], r[k], r[k + 1]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat);
  m.position.x = x;
  m.castShadow = true;
  g.add(m);
  return m;
}

function box(g, w, h, d, mat, x, y, z, rotX = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.x = rotX;
  m.castShadow = true;
  g.add(m);
  return m;
}

/** A painted stripe that follows the bodywork: [z, y] points, at x, half-width hw. */
function stripe(g, points, x, hw, mat) {
  loft(g, points.map(([z, y]) => st(z, y - 0.015, y + 0.005, y + 0.02, hw, hw, hw)), mat, x);
}

/** Big chunky wheels: eight-sided tire, six-sided hub. */
function wheel(g, x, z, r = 0.44, w = 0.36) {
  const t = new THREE.Mesh(new THREE.CylinderGeometry(r, r, w, 8), M.tire);
  t.rotation.z = Math.PI / 2;
  t.position.set(x, r, z);
  t.castShadow = true;
  g.add(t);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.55, r * 0.55, w + 0.03, 6), M.rim);
  hub.rotation.z = Math.PI / 2;
  hub.position.set(x, r, z);
  g.add(hub);
}
function wheels(g, x, zs, r, w) {
  for (const z of zs) for (const s of [-1, 1]) wheel(g, s * x, z, r, w);
}
/** Headlights and taillights: blocky pairs at the corners. */
function lights(g, x, y, front, rear, wide = 0.42, h = 0.16) {
  for (const s of [-1, 1]) {
    box(g, wide, h, 0.1, M.head, s * x, y, front);
    box(g, wide, h, 0.1, M.tail, s * x, y, rear);
  }
}
/** Windows and a painted roof: a raked glasshouse with a thin roof panel on top. */
function cabin(g, p, { front, peakF, peakR, rear, base, top, w, t, roof = p }) {
  loft(g, [st(front, base, base + 0.01, base + 0.03, w, w - 0.03, w), st(peakF, base, base + 0.05, top, w, t, w), st(peakR, base, base + 0.05, top, w, t, w), st(rear, base, base + 0.01, base + 0.03, w, w - 0.03, w)], M.glass);
  loft(g, [st(peakF - 0.06, top - 0.01, top + 0.01, top + 0.08, t + 0.03, t - 0.03, t + 0.03), st(peakR + 0.06, top - 0.01, top + 0.01, top + 0.08, t + 0.03, t - 0.03, t + 0.03)], roof);
}

// Forward is -Z. Short, wide and tall on big wheels: toy-car proportions that read on a map.
const BUILD = {
  car(g, p, c) {
    loft(g, [st(-2.2, 0.36, 0.62, 0.72, 0.86, 0.72), st(-2.0, 0.28, 0.72, 0.84, 1.06, 0.88), st(-0.8, 0.28, 0.8, 0.98, 1.14, 0.94), st(1.25, 0.28, 0.8, 0.98, 1.14, 0.94), st(2.0, 0.3, 0.76, 0.94, 1.08, 0.88), st(2.2, 0.4, 0.68, 0.8, 0.88, 0.74)], p);
    cabin(g, p, { front: -0.9, peakF: -0.2, peakR: 0.75, rear: 1.4, base: 0.95, top: 1.5, w: 0.96, t: 0.76 });
    wheels(g, 1.02, [-1.32, 1.32]);
    lights(g, 0.66, 0.68, -2.22, 2.22);
    box(g, 0.7, 0.14, 0.08, M.trim, 0, 0.56, -2.22);
  },
  hatch(g, p, c) {
    loft(g, [st(-1.8, 0.36, 0.66, 0.78, 0.88, 0.76), st(-1.6, 0.28, 0.76, 0.9, 1.08, 0.92), st(-0.75, 0.28, 0.84, 1.02, 1.14, 0.96), st(1.5, 0.28, 0.84, 1.02, 1.14, 0.96), st(1.75, 0.34, 0.8, 0.98, 1.02, 0.88)], p);
    cabin(g, p, { front: -0.85, peakF: -0.25, peakR: 1.35, rear: 1.65, base: 1, top: 1.66, w: 1, t: 0.82, roof: c });
    for (const s of [-1, 1]) stripe(g, [[-1.75, 0.8], [-1.6, 0.92], [-0.85, 1.05]], s * 0.26, 0.1, c); // twin bonnet stripes
    wheels(g, 1.02, [-1.12, 1.12], 0.42);
    lights(g, 0.68, 0.72, -1.82, 1.77, 0.34, 0.2);
    box(g, 0.66, 0.16, 0.08, M.trim, 0, 0.58, -1.82);
  },
  sport(g, p, c) {
    // Low wedge: nose near the ground, wide hips over the rear wheels.
    loft(g, [st(-2.35, 0.26, 0.42, 0.5, 0.92, 0.72), st(-2.1, 0.2, 0.5, 0.58, 1.14, 0.9), st(-1.0, 0.2, 0.62, 0.76, 1.24, 0.98), st(0.2, 0.2, 0.62, 0.78, 1.16, 0.94), st(1.4, 0.2, 0.72, 0.9, 1.3, 1.0), st(2.1, 0.26, 0.74, 0.9, 1.2, 0.94), st(2.3, 0.36, 0.7, 0.8, 1, 0.8)], p);
    cabin(g, p, { front: -1.0, peakF: -0.25, peakR: 0.6, rear: 1.55, base: 0.78, top: 1.2, w: 0.9, t: 0.62 });
    for (const s of [-1, 1]) {
      stripe(g, [[-2.28, 0.53], [-2.1, 0.61], [-1.0, 0.79]], s * 0.2, 0.11, c);
      stripe(g, [[-0.3, 1.29], [0.65, 1.29]], s * 0.2, 0.11, c);
      box(g, 0.1, 0.32, 0.12, M.trim, s * 0.75, 1.02, 2.0); // wing posts
    }
    box(g, 2.3, 0.08, 0.5, c, 0, 1.2, 2.08); // rear wing
    for (const s of [-1, 1]) box(g, 0.08, 0.26, 0.56, M.trim, s * 1.15, 1.2, 2.08);
    box(g, 2.1, 0.1, 0.12, M.trim, 0, 0.26, -2.34); // splitter
    wheels(g, 1.12, [-1.45, 1.5], 0.44, 0.44);
    lights(g, 0.72, 0.5, -2.34, 2.32, 0.5, 0.1);
  },
  classic(g, p, c) {
    // Long hood, short deck: a sixties fastback.
    loft(g, [st(-2.5, 0.34, 0.64, 0.74, 0.96, 0.82), st(-2.3, 0.3, 0.72, 0.84, 1.08, 0.92), st(-0.5, 0.3, 0.76, 0.94, 1.14, 0.96), st(1.5, 0.3, 0.78, 0.94, 1.16, 0.96), st(2.3, 0.34, 0.76, 0.9, 1.1, 0.92), st(2.48, 0.42, 0.7, 0.8, 0.96, 0.84)], p);
    cabin(g, p, { front: -0.6, peakF: 0.0, peakR: 0.75, rear: 2.05, base: 0.92, top: 1.42, w: 0.96, t: 0.72, roof: c });
    for (const s of [-1, 1]) stripe(g, [[-2.45, 0.77], [-2.3, 0.87], [-0.6, 0.97]], s * 0.26, 0.13, c);
    box(g, 2.2, 0.14, 0.14, M.chrome, 0, 0.42, -2.52);
    box(g, 2.2, 0.14, 0.14, M.chrome, 0, 0.42, 2.5);
    wheels(g, 1.05, [-1.55, 1.55], 0.44, 0.38);
    for (const s of [-1, 1]) {
      const h = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.08, 8), M.head);
      h.rotation.x = Math.PI / 2;
      h.position.set(s * 0.7, 0.66, -2.52);
      g.add(h);
      box(g, 0.34, 0.14, 0.08, M.tail, s * 0.68, 0.68, 2.49);
    }
  },
  suv(g, p, c) {
    loft(g, [st(-2.25, 0.46, 0.8, 0.94, 0.92, 0.8), st(-2.05, 0.4, 0.92, 1.08, 1.12, 0.96), st(-0.95, 0.4, 1, 1.2, 1.18, 1), st(2.0, 0.4, 1, 1.2, 1.18, 1), st(2.25, 0.5, 0.94, 1.12, 1.04, 0.9)], p);
    cabin(g, p, { front: -1.05, peakF: -0.5, peakR: 1.9, rear: 2.2, base: 1.18, top: 1.86, w: 1.04, t: 0.9 });
    for (const s of [-1, 1]) box(g, 0.08, 0.08, 2.3, M.trim, s * 0.74, 2, 0.7); // roof rails
    box(g, 2.2, 0.2, 0.12, M.trim, 0, 0.5, -2.28);
    wheels(g, 1.08, [-1.42, 1.42], 0.52, 0.42);
    lights(g, 0.7, 0.9, -2.27, 2.27, 0.4, 0.18);
  },
  van(g, p, c) {
    loft(g, [st(-2.65, 0.36, 0.78, 0.96, 0.92, 0.8), st(-2.4, 0.3, 0.92, 1.14, 1.12, 0.96), st(-1.7, 0.3, 1, 1.26, 1.18, 1.02), st(2.5, 0.3, 1, 1.26, 1.18, 1.02), st(2.65, 0.4, 0.96, 1.2, 1.06, 0.94)], p);
    // A tall box with a sloped screen, and a band of windows down the side.
    loft(g, [st(-1.85, 1.2, 1.24, 1.28, 1.08, 1.0, 1.08), st(-1.15, 1.2, 1.3, 2.04, 1.08, 0.94, 1.08), st(2.5, 1.2, 1.3, 2.04, 1.08, 0.94, 1.08), st(2.62, 1.2, 1.26, 1.96, 1, 0.9, 1)], p);
    loft(g, [st(-1.82, 1.28, 1.3, 1.34, 1.1, 1.02, 1.1), st(-1.2, 1.3, 1.36, 1.98, 1.1, 0.96, 1.1), st(-0.75, 1.3, 1.36, 1.98, 1.1, 0.96, 1.1), st(-0.72, 1.3, 1.36, 1.34, 1.1, 1.08, 1.1)], M.glass);
    for (const s of [-1, 1]) box(g, 0.03, 0.42, 2.7, M.glass, s * 1.085, 1.62, 0.75);
    stripe(g, [[-1.1, 2.06], [2.5, 2.06]], 0, 0.3, c);
    wheels(g, 1.06, [-1.7, 1.75], 0.46, 0.38);
    lights(g, 0.7, 0.84, -2.67, 2.67, 0.42, 0.2);
    box(g, 0.8, 0.16, 0.08, M.trim, 0, 0.56, -2.67);
  },
  pickup(g, p, c) {
    loft(g, [st(-2.6, 0.5, 0.86, 1, 0.94, 0.82), st(-2.35, 0.44, 0.98, 1.14, 1.14, 0.98), st(-0.8, 0.44, 1.04, 1.24, 1.18, 1), st(2.65, 0.44, 1.04, 1.24, 1.18, 1)], p);
    box(g, 2.0, 0.08, 1.9, M.trim, 0, 1.25, 1.6); // truck bed floor sits over the body
    for (const s of [-1, 1]) box(g, 0.16, 0.36, 2.0, p, s * 1.04, 1.4, 1.62); // bed rails
    box(g, 2.2, 0.36, 0.14, p, 0, 1.4, 2.6); // tailgate
    cabin(g, p, { front: -0.9, peakF: -0.35, peakR: 0.45, rear: 0.62, base: 1.22, top: 1.86, w: 1.02, t: 0.88 });
    box(g, 2.2, 0.2, 0.12, M.chrome, 0, 0.52, -2.62);
    box(g, 2.2, 0.16, 0.12, M.trim, 0, 0.52, 2.68);
    wheels(g, 1.08, [-1.55, 1.65], 0.54, 0.44);
    lights(g, 0.72, 0.94, -2.62, 2.68, 0.36, 0.2);
  },
  jeep(g, p, c) {
    loft(g, [st(-2.05, 0.56, 0.92, 1.06, 1.02, 0.92), st(-0.5, 0.56, 0.98, 1.16, 1.08, 0.96), st(1.8, 0.56, 0.98, 1.16, 1.08, 0.96), st(2.0, 0.62, 0.94, 1.1, 1.0, 0.9)], p);
    box(g, 1.8, 0.5, 0.08, M.glass, 0, 1.4, -0.5, 0.2); // upright windshield
    for (const s of [-1, 1]) {
      box(g, 0.56, 0.34, 0.56, M.seat, s * 0.44, 1.32, 0.3); // seats
      box(g, 0.1, 0.1, 1.7, M.trim, s * 0.86, 2.0, 0.55); // roll cage
      box(g, 0.1, 0.84, 0.1, M.trim, s * 0.86, 1.58, 1.4);
      box(g, 0.1, 0.84, 0.1, M.trim, s * 0.86, 1.58, -0.3);
      stripe(g, [[-2, 1.09], [-0.5, 1.19]], s * 0.3, 0.11, c);
    }
    box(g, 1.8, 0.1, 0.1, M.trim, 0, 2.0, 1.4);
    box(g, 1.8, 0.1, 0.1, M.trim, 0, 2.0, -0.3);
    box(g, 2.2, 0.2, 0.14, M.trim, 0, 0.62, -2.08);
    const spare = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.44, 0.3, 8), M.tire);
    spare.rotation.x = Math.PI / 2;
    spare.position.set(0, 1.12, 2.16);
    spare.castShadow = true;
    g.add(spare);
    wheels(g, 1.14, [-1.3, 1.3], 0.6, 0.52);
    lights(g, 0.66, 0.92, -2.07, 2.02, 0.3, 0.26);
  },
  moto(g, p, c) {
    g.scale.setScalar(1.5); // a bike at true scale is unreadable on the map
    wheel(g, 0, -1.0, 0.44, 0.2);
    wheel(g, 0, 1.0, 0.44, 0.2);
    loft(g, [st(-0.95, 0.74, 0.82, 0.96, 0.18, 0.1), st(-0.55, 0.56, 0.86, 1.12, 0.27, 0.16), st(0.1, 0.5, 0.82, 1.06, 0.26, 0.18), st(0.6, 0.66, 0.9, 1.08, 0.18, 0.14), st(1.05, 0.86, 0.98, 1.1, 0.12, 0.08)], p);
    box(g, 0.3, 0.12, 0.72, M.seat, 0, 1.12, 0.42);
    box(g, 1.05, 0.06, 0.08, M.trim, 0, 1.24, -0.72); // handlebars
    box(g, 0.2, 0.12, 0.06, M.head, 0, 1, -0.98);
    box(g, 0.16, 0.08, 0.06, M.tail, 0, 1.06, 1.06);
    // rider
    loft(g, [st(0.0, 1.2, 1.26, 1.8, 0.3, 0.2), st(0.5, 1.2, 1.26, 1.7, 0.28, 0.2)], M.skin);
    const helmet = new THREE.Mesh(new THREE.IcosahedronGeometry(0.28, 0), M.paint(0xf4f4f0));
    helmet.position.set(0, 1.98, -0.02);
    helmet.castShadow = true;
    g.add(helmet);
    box(g, 0.34, 0.1, 0.06, M.glass, 0, 2.0, -0.28);
    for (const s of [-1, 1]) box(g, 0.13, 0.13, 0.64, M.skin, s * 0.34, 1.48, -0.32, 0.5); // arms
  },
};

// ?view=side renders the garage showroom shots instead of the top-down map sprites.
const VIEW = new URLSearchParams(location.search).get('view') === 'side' ? 'side' : 'top';
const SIDE_W = 720;
const SIDE_H = 360;

function render(name, paint) {
  const side = VIEW === 'side';
  renderer.setSize(side ? SIDE_W : SIZE, side ? SIDE_H : SIZE);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6a6f80, 1.5));
  const sun = new THREE.DirectionalLight(0xffffff, 2.0);
  sun.position.set(side ? 5 : -4, 10, side ? -5 : -3);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.radius = 3;
  Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 30 });
  scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.32 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const g = new THREE.Group();
  const contrast = paint.light ? flat(0xe0431c) : M.white;
  BUILD[name](g, M.paint(paint.hex), contrast);
  scene.add(g);

  // The bike stands tallest (rider and all), so its showroom shot pulls back a little.
  const camera = new THREE.PerspectiveCamera(side ? (name === 'moto' ? 25 : 19) : 24, side ? SIDE_W / SIDE_H : 1, 1, 100);
  if (side) {
    // Showroom: a low three-quarter view of the right side, nose pointing right.
    camera.position.set(9.6, 4.2, -5.4);
    camera.lookAt(0, name === 'moto' ? 1.4 : 0.75, -0.1);
  } else {
    // Slight tilt from behind shows the rear and the cabin's sides without fighting the map's rotation.
    const tilt = THREE.MathUtils.degToRad(16);
    camera.position.set(0, 15 * Math.cos(tilt), 15 * Math.sin(tilt));
    camera.up.set(0, 0, -1);
    camera.lookAt(0, 0, 0);
  }
  renderer.render(scene, camera);

  const out = document.createElement('canvas');
  out.width = side ? SIDE_W : SIZE;
  out.height = side ? SIDE_H : SIZE;
  out.getContext('2d').drawImage(renderer.domElement, 0, 0);
  return out;
}

function scaled(src, size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, size, size);
  return c;
}

async function save(canvas, name) {
  const blob = await new Promise((r) => canvas.toBlob(r, name.endsWith('.webp') ? 'image/webp' : 'image/png', 0.9));
  const res = await fetch(`/save?name=${name}`, { method: 'POST', body: blob });
  if (!res.ok) throw new Error(`save ${name} failed`);
}

// Keep in sync with PAINTS in src/lib/vehicles.ts.
const PAINTS = {
  blue: { hex: 0x1e9bff }, red: { hex: 0xe5281f }, orange: { hex: 0xff8a00 }, yellow: { hex: 0xffc400, light: true },
  green: { hex: 0x2dbe60 }, purple: { hex: 0x8e5cff }, white: { hex: 0xeef0f3, light: true }, silver: { hex: 0x9aa3ae, light: true },
  black: { hex: 0x1c1d22 },
};
const params = new URLSearchParams(location.search);
const only = params.get('only'); // e.g. ?only=van for quick previews
const onlyPaint = params.get('paint');
const NOSAVE = params.has('nosave');
const grid = document.getElementById('grid');
for (const name of Object.keys(BUILD).filter((n) => !only || n === only)) {
  for (const [color, paint] of Object.entries(PAINTS)) {
    if (onlyPaint && color !== onlyPaint) continue;
    const big = render(name, paint);
    const file = `${name}-${color}`;
    if (VIEW === 'side') {
      // One sharp size, WebP to keep the app bundle small (81 cards).
      grid.appendChild(big);
      if (NOSAVE) continue;
      await save(big, `side-${file}@2x.webp`);
      continue;
    }
    grid.appendChild(scaled(big, 96));
    if (NOSAVE) continue;
    await save(big, `${file}@3x.png`);
    await save(scaled(big, (SIZE * 2) / 3), `${file}@2x.png`);
    await save(scaled(big, SIZE / 3), `${file}.png`);
  }
}
document.getElementById('status').textContent = 'done';
</script>
</body>
</html>
