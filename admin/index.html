<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Convoy</title>
<link rel="icon" type="image/png" href="./favicon.png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<style>
  :root {
    --bg: #000; --panel: #111214; --panel-2: #1c1d21; --border: #232428; --text: #fff; --muted: #a1a1aa;
    --accent: #1e9bff; --speed: #ffa630; --ok: #30d158; --warn: #ff9f0a; --danger: #ff453a;
    --radius: 14px; color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2f3f5; --panel: #fff; --panel-2: #ebedf0; --border: rgba(10,10,11,.08); --text: #0a0a0b; --muted: #6b7280;
      --accent: #0a84ff; --speed: #f07a0a; color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; border-radius: 10px; padding: 9px 14px; background: var(--panel-2); font-weight: 600; }
  button.primary { background: var(--accent); color: #fff; }
  button.danger { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
  button.ghost { background: transparent; color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  input, select { background: var(--panel-2); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; width: 100%; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  /* auth */
  .auth { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .auth-card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 28px; display: grid; gap: 14px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; }
  .logo-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; }
  .logo-mark img { width: 26px; height: auto; display: block; }
  .msg { font-size: 14px; }
  .legal { margin: 0; font-size: 12px; text-align: center; }
  .legal a { color: var(--accent); }
  .msg.err { color: var(--danger); } .msg.ok { color: var(--ok); }

  /* shell */
  .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  nav { border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
  nav .logo { padding: 0 8px 16px; }
  nav button { text-align: left; background: transparent; color: var(--muted); padding: 10px 12px; }
  nav button.active { background: var(--panel-2); color: var(--text); }
  nav .spacer { flex: 1; }
  main { padding: 28px; min-width: 0; }
  h1 { font-size: 28px; margin: 0 0 18px; letter-spacing: -.3px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .stat b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
  .toolbar input { max-width: 360px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700; }
  tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--panel-2); }
  .who { display: flex; align-items: center; gap: 10px; }
  .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex: none; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--panel-2); margin: 1px 2px 1px 0; }
  .chip.pro { background: color-mix(in srgb, var(--speed) 20%, transparent); color: var(--speed); }
  .chip.bad { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
  .chip.good { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .table-wrap { overflow-x: auto; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }

  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--panel); border-left: 1px solid var(--border); padding: 24px; overflow-y: auto; display: grid; gap: 18px; align-content: start; }
  .drawer h2 { margin: 0; font-size: 22px; }
  .section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 8px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 10px; font-size: 14px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--border); padding: 10px 16px; border-radius: 12px; font-weight: 600; }

  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    nav { position: static; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--border); padding: 12px; }
    nav .logo { width: 100%; padding: 0 4px 8px; }
    nav .spacer { display: none; }
    main { padding: 16px; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>

<!-- Sign in / create account -->
<section id="auth" class="auth hidden">
  <form class="auth-card" id="auth-form">
    <div class="logo"><div class="logo-mark"><img src="./logo.png" alt="" /></div>Convoy</div>
    <p class="muted" id="auth-sub" style="margin:0">Sign in with your Convoy account.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="email" required />
    <input id="password" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" minlength="8" required />
    <button class="primary" type="submit" id="auth-submit">Sign in</button>
    <button class="ghost" type="button" id="auth-toggle">New here? Create an account</button>
    <div class="msg" id="auth-msg"></div>
    <p class="muted legal">By using Convoy you agree to the <a href="/terms" target="_blank">Terms of Service</a> and <a href="/privacy" target="_blank">Privacy Policy</a>.</p>
  </form>
</section>

<!-- Signed in, not an admin -->
<section id="denied" class="auth hidden">
  <div class="auth-card">
    <div class="logo"><div class="logo-mark"><img src="./logo.png" alt="" /></div>Convoy</div>
    <p style="margin:0">This account isn’t an admin.</p>
    <p class="muted" style="margin:0">If it should be, make sure the email address is confirmed (check your inbox for the Supabase email) and that it’s on the admin list.</p>
    <button id="denied-out">Sign out</button>
  </div>
</section>

<!-- Portal -->
<div id="app" class="shell hidden">
  <nav>
    <div class="logo"><div class="logo-mark"><img src="./logo.png" alt="" /></div>Convoy</div>
    <button data-view="overview" class="active">Overview</button>
    <button data-view="users">Users</button>
    <button data-view="drives">Live drives</button>
    <button data-view="clubs">Clubs</button>
    <button data-view="reports">Road reports</button>
    <button data-view="audit">Audit log</button>
    <div class="spacer"></div>
    <div class="muted" id="me" style="font-size:13px;padding:0 12px 8px;word-break:break-all"></div>
    <button id="sign-out">Sign out</button>
  </nav>
  <main id="view"></main>
</div>

<div id="drawer-root"></div>
<div id="toast" class="toast hidden"></div>

<script src="./supabase.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
